apiVersion: apps/v1
kind: Deployment
metadata:
  name: scan-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: scan-worker
  template:
    metadata:
      labels:
        app: scan-worker
    spec:
      containers:
        - name: scan-worker
          image: ghcr.io/razhagani/sub-manager-worker:latest
          imagePullPolicy: IfNotPresent
          command: ["node", "src/scan.worker.js"]
          envFrom:
            - configMapRef:
                name: submanager-config
            - secretRef:
                name: submanager-secret
          resources:
            requests:
              memory: "96Mi"
              cpu: "50m"
            limits:
              memory: "192Mi"
              cpu: "250m"
