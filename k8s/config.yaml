apiVersion: v1
kind: ConfigMap
metadata:
  name: submanager-config
data:
  POSTGRES_DB: "submanager"
  POSTGRES_USER: "submanager"
  REDIS_HOST: "redis"
  REDIS_PORT: "6379"
---
apiVersion: v1
kind: Secret
metadata:
  name: submanager-secret
type: Opaque
stringData:
  POSTGRES_PASSWORD: "dev_password"
  DATABASE_URL: "postgres://submanager:dev_password@postgres:5432/submanager"
